{% extends "base.html" %}

{% block title %}Change Password — Passport Automation System{% endblock %}

{% block content %}
<div class="container" style="max-width: 540px;">
  
  <ul class="breadcrumb">
    <li><a href="{% if current_user_role == 'applicant' %}{{ url_for('applicant.dashboard') }}{% else %}{{ url_for('officer.dashboard') }}{% endif %}"><i class="fas fa-home"></i> Home</a></li>
    <li class="breadcrumb-separator">/</li>
    <li>Change Password</li>
  </ul>

  <div class="card">
    <div class="card-header" style="background: var(--surface-white); padding: 22px 28px;">
      <div>
        <h2 style="font-size: 20px; color: var(--primary-900);">Update Account Password</h2>
        <p style="font-size: 13px; color: var(--slate-500); margin-top: 2px;">Ensure your account remains protected with a strong password</p>
      </div>
    </div>

    <div class="card-body" style="padding: 28px;">
      <form action="{{ url_for('auth.change_password') }}" method="POST">
        
        <div class="form-group">
          <label class="form-label" for="current_password">Current Password <span class="required">*</span></label>
          <input type="password" name="current_password" id="current_password" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password <span class="required">*</span></label>
          <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Min. 6 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password <span class="required">*</span></label>
          <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center;">
          <a href="{% if current_user_role == 'applicant' %}{{ url_for('applicant.dashboard') }}{% else %}{{ url_for('officer.dashboard') }}{% endif %}" class="btn btn-secondary">
            Cancel
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-key"></i> Update Password
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
