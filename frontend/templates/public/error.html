{% extends "base.html" %}

{% block title %}{{ error_code }} — {{ error_title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto; text-align: center;">
  <div class="card" style="padding: 40px 24px;">
    <div style="font-size: 64px; font-weight: 800; color: var(--primary-600); line-height: 1;">
      {{ error_code }}
    </div>
    <h2 style="font-size: 24px; margin: 16px 0 8px; color: var(--slate-900);">{{ error_title }}</h2>
    <p style="color: var(--slate-600); font-size: 15px; margin-bottom: 28px;">
      {{ error_message }}
    </p>
    <div>
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Return to Homepage
      </a>
    </div>
  </div>
</div>
{% endblock %}
